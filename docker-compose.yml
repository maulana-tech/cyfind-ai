services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyfind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cyfind}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyfind} -d ${POSTGRES_DB:-cyfind}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cyfind:
    image: tomicdd/cyfind:${CYFIND_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CYFIND_PG_DSN: postgres://${POSTGRES_USER:-cyfind}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cyfind}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CYFIND_LLM_PROVIDER: ${CYFIND_LLM_PROVIDER:-}
      CYFIND_LLM_MODEL: ${CYFIND_LLM_MODEL:-}
      CYFIND_LLM_BASE_URL: ${CYFIND_LLM_BASE_URL:-}
      CYFIND_LLM_PROXY: ${CYFIND_LLM_PROXY:-}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # Bind the data directory (jwt.key, SQLite, etc.) to data/ at the project root,
      # so it is easy to inspect/back up on the host and survives container rebuilds.
      - ./data:/app/data
      # Mount the project-root skills into the container (overriding the image-bundled /app/skills);
      # editing a skill needs no image rebuild — the container reads this host copy.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
