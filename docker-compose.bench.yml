# CYFIND benchmark evaluation image — one-command local build + run.
# Independent of the production docker-compose.yml (multi-service: cyfind+postgres).
# Usage:
#   cp bench/.env.example bench/.env   # fill in LLM_API_KEY / BENCHMARK_TOKEN etc.
#   docker compose -f docker-compose.bench.yml up --build      # build and run in the foreground (view logs)
#   docker compose -f docker-compose.bench.yml up --build -d   # detached
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # stop (add -v to also remove the data volume)
# Browser: http://localhost:8787 (log in with ADMIN_PASSWORD)

services:
  cyfind-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: cyfind-bench:latest
    container_name: cyfind-bench
    env_file:
      - bench/.env
    # Share the host network: the container uses the host network stack and can reach lab targets on the host/VPN directly.
    # In host mode there is no ports mapping; the container binds host ports directly: 8787 (UI/API), 8788 (proxy),
    # and internal PostgreSQL 5432 — make sure these three host ports are free (stop whatever uses them before testing).
    network_mode: host
    restart: "no"

volumes:
  cyfind_bench_data:
