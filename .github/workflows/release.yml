name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # required to create a Release

jobs:
  # (1) Frontend static export (once); the output is reused by every cross-compile target
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out

  # (2) Cross-compile for five platforms (embedded frontend) + zip
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          CYFIND_TARGET_OS: ${{ matrix.goos }}
          CYFIND_TARGET_ARCH: ${{ matrix.goarch }}
          CYFIND_BUILD_VERSION: ${{ github.ref_name }}
          CYFIND_SKIP_FRONTEND: "1"
          CYFIND_SKIP_NPM_CI: "1"
          # UPX self-extracting ELF crashes under some Linux kernels, virtualization, and security policies.
          # Releases rely on Go linker stripping and zip compression, favoring portability.
          CYFIND_COMPRESS: "0"
          CYFIND_PACKAGE: "1"
          CYFIND_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${CYFIND_TARGET_OS}/${CYFIND_TARGET_ARCH}"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/cyfind-linux-amd64/cyfind -h
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"
      # The raw Linux binary is uploaded separately so the docker job can reuse it (avoids rebuilding frontend+Go in the image)
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/cyfind-linux-${{ matrix.goarch }}/cyfind

  # (3) Collect all zips -> create the GitHub Release
  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true

  # (4) Multi-arch images -> push to Docker Hub (reuse the Linux binary built in the binaries job,
  #    the image only installs tools + drops in the binary; arm64 only emulates the apt layer, so builds are much faster)
  docker:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # fetch the Dockerfile and skills/
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-amd64
          path: dist/amd64
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-arm64
          path: dist/arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: autumn27/cyfind
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
